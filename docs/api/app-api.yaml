    PushRequest:
      type: object
      additionalProperties: false
      required:
      - device_id
      - changes
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 端末の ID（アプリを入れたときに作る UUID）
        changes:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/Change'
          description: 変えた順に並べる。25件より多いときは分けて送る
    PushResult:
      type: object
      required:
      - change_id
      - status
      properties:
        change_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - accepted
          - duplicate
          - rejected
          description: accepted：受け付けた。duplicate：前に受け付けた（状態は変わらない）。rejected：断った（送り直しても同じなので、端末で扱いを決める）
        seq:
          type:
          - integer
          - 'null'
          description: 受け付けた変更の通し番号（rejected では null）
        error:
          oneOf:
          - $ref: '#/components/schemas/ChangeError'
          - type: 'null'
    ChangeError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - invalid_fields
          - missing_fields
          - missing_parent_id
          - parent_id_not_allowed
          - fields_not_allowed
          - insufficient_scope
          - op_not_allowed
          description: invalid_fields：知らない項目・型（"10" と 10、1 と true は別）・範囲の違い、null にできない項目に null、entity_id・op・changed_at・origin の誤り。missing_fields：create に要る項目がない。missing_parent_id：meal_item に parent_id がない。parent_id_not_allowed：meal_item
            以外に parent_id がある。fields_not_allowed：delete・restore に fields がある。insufficient_scope：その種類を書く scope がない。op_not_allowed：アプリから受け付けない op か項目（report の delete と next_steps_done の update 以外）
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    PushResponse:
      type: object
      required:
      - results
      - cursor
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'
          description: 送った順
        cursor:
          type: integer
          description: サーバーの今の通し番号（受け取りの目安）
    EntityState:
      type: object
      required:
      - entity_type
      - entity_id
      - parent_id
      - fields
      - deleted
      - created_at
      - updated_at
      - deleted_at
      - seq
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        fields:
          type: object
          description: 今の値（種類ごとの *Fields の形。まだ届いていない項目はない）
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 当てはめた変更の時刻のうち、いちばん新しいもの
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        seq:
          type: integer
          description: この状態に最後に当てはめた変更の通し番号。端末は大きい方を残す
    ChangeRecord:
      type: object
      required:
      - seq
      - change_id
      - entity_type
      - entity_id
      - parent_id
      - op
      - fields
      - changed_at
      - received_at
      - origin
      - device_id
      properties:
        seq:
          type: integer
        change_id:
          type: string
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        fields:
          type:
          - object
          - 'null'
        changed_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        origin:
          type: string
          enum:
          - app
          - import
          - mcp
          - migration
        device_id:
          type:
          - string
          - 'null'
    ChangesPage:
      type: object
      required:
      - entries
      - next_cursor
      - has_more
      properties:
        entries:
          type: array
          items:
            type: object
            required:
            - change
            - state
            properties:
              change:
                $ref: '#/components/schemas/ChangeRecord'
              state:
                $ref: '#/components/schemas/EntityState'
        next_cursor:
          type: integer
          description: 次の after に使う（読めない種類の変更を飛ばした分も進む）
        has_more:
          type: boolean
    SnapshotPage:
      type: object
      required:
      - states
      - cursor
      - next_page_token
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/EntityState'
        cursor:
          type: integer
          description: 最初のページを読んだときの通し番号。全部読んだら、ここから /v1/sync/changes を読む
        next_page_token:
          type:
          - string
          - 'null'
          description: null なら終わり
    GoalSuggestionRequest:
      type: object
      additionalProperties: false
      description: >-
        性別と生まれた年は、直近7日に体脂肪率の記録がなく Mifflin-St Jeor が要るときだけ使う（サーバーにはないため）。
        計算に使うだけで保存しない。体重・体脂肪率・身長・目標体重・活動の量は、同期した体組成と設定から読む
      properties:
        sex:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - null
        birth_year:
          type:
          - integer
          - 'null'
          description: 西暦。15〜100歳の範囲（外なら 422）
    GoalSuggestion:
      type: object
      required:
      - status
      - goal
      properties:
        status:
          type: string
          enum:
          - ok
          - needs_input
        goal:
          description: 保存する目標の形（status が needs_input なら null）
          oneOf:
          - $ref: '#/components/schemas/NutritionGoalFields'
          - type: 'null'
        message:
          type: string
          description: needs_input のとき、足りない入力の案内
        missing:
          type: array
          description: needs_input のとき、足りない入力（weight・sex・birth_year・height・activity）
          items:
            type: object
            required:
            - item
            - label
            - how
            properties:
              item:
                type: string
              label:
                type: string
              how:
                type: string
        training_day:
          type: object
          description: ok のとき、筋トレの日の kcal・たんぱく質・脂質・炭水化物
        rest_day:
          type: object
          description: ok のとき、休みの日の kcal・たんぱく質・脂質・炭水化物
        basis:
          type: object
          description: ok のとき、計算のもと（体重と日付、体脂肪率、式、基礎代謝、1日の消費、係数、方針、週のペース、1日あたりの差、たんぱく質）
        notes:
          type: array
          items:
            type: string
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: 例：changes[2].fields.amount
        message:
          type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      description: Lambda が返すエラー（RFC 9457）
      properties:
        type:
          type: string
          description: 例：https://torelog.invalid/problems/invalid-request
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    GatewayError:
      type: object
      required:
      - message
      description: API Gateway が Lambda の前で返すエラー（形は変えられない）。401：Unauthorized、403：Forbidden、429：Too Many Requests
      properties:
        message:
          type: string
