# hlog アプリ用 API（同期）。設計は docs/sync-design.md。
# 生成したあとは、この YAML を直接直す。
openapi: 3.1.0
info:
  title: hlog アプリ用 API
  version: 0.1.0
  description: |-
    スマホアプリ（hlog）の同期の API。設計は docs/sync-design.md。

    - 認可：Cognito のアプリ用クライアント（torelog-app）のアクセストークンを `Authorization: Bearer` で送る。ID トークンは断る
    - 利用者はトークンの sub で決まる。本文や URL に利用者の ID は入れない
    - 時刻は UTC の RFC 3339（ミリ秒まで）。日付と食事の時刻（time）は日本時間
    - エラー：Lambda のエラーは application/problem+json（Problem）。API Gateway のエラー（401・403・429）は {"message": "..."}（GatewayError）
    - 流量の制限：1秒10回・瞬間20回。超えると 429（Retry-After はない。少し待って送り直す）
servers:
- url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com
  description: cdk deploy の出力 AppApiUrl
  variables:
    apiId:
      default: xxxxxxxxxx
security: []
paths:
  /v1/sync/changes:
    post:
      operationId: pushChanges
      summary: 端末の変更を送る（まとめて、冪等）
      description: |-
        1回に25件まで、本文は 64KB（65536 バイト）まで。1件ごとに accepted・duplicate・rejected を返す。rejected があっても、ほかの変更は受け付ける。
        応答を受け取れなかったときは、同じ change_id のまま送り直す。
      security:
      - cognito:
        - torelog-api/meals.write
      - cognito:
        - torelog-api/training.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: 1件ごとの結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          description: 本文の形が違う（JSON でない、changes が26件以上、change_id の重複など）。1件も受け付けていない
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 本文が 64KB を超える。1件も受け付けていない。changes を分けて送る
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: pullChanges
      summary: カーソル以降の変更を受け取る（ページ送り）
      description: seq が after より大きい変更を、seq の順に返す。読める scope のない種類は飛ばす。
      security:
      - cognito:
        - torelog-api/meals.read
      - cognito:
        - torelog-api/training.read
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: 変更と、当てはめたあとの状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '400':
          description: after・limit が範囲の外
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sync/snapshot:
    get:
      operationId: getSnapshot
      summary: 初回の全件の取得
      description: '今の状態を全部返す（消えたものも deleted: true で返す）。最初のページの cursor を覚え、全部読んだら /v1/sync/changes?after=cursor を読む。'
      security:
      - cognito:
        - torelog-api/meals.read
      - cognito:
        - torelog-api/training.read
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
        description: 前のページの next_page_token
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: 今の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          description: page_token が壊れている、ほかの人のもの、limit が範囲の外
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/meals/goal-suggestions:
    post:
      operationId: suggestGoals
      summary: 食事の目標の案を計算する（保存しない）
      description: MCP の suggest_goals と同じ計算（アプリの lib/autoGoal.ts と同じ式）。案を本人が確かめたら、nutrition_goal の update を同期で送って保存する。
      security:
      - cognito:
        - torelog-api/meals.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalSuggestionRequest'
      responses:
        '200':
          description: 目標の案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSuggestion'
        '400':
          description: 本文の形が違う（知らない項目、型、選択肢にない値）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 値が決まりに合わない（例：生まれた年が15〜100歳の外）。detail ではなく title に理由が入る
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cognito:
      type: oauth2
      description: Cognito のマネージドログイン（パスキー）。認可コード＋PKCE。毎回 prompt=login を付ける
      flows:
        authorizationCode:
          authorizationUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/token
          refreshUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/token
          scopes:
            openid: OIDC
            torelog-api/meals.read: 食事の記録を読む
            torelog-api/meals.write: 食事の記録を書く
            torelog-api/training.read: 筋トレの記録を読む
            torelog-api/training.write: 筋トレの記録を書く
  responses:
    Unauthorized:
      description: トークンがない、期限切れ、issuer か audience が違う（ID トークンや認可API のトークンを含む）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    Forbidden:
      description: ルートに要る scope がない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    TooManyRequests:
      description: 流量の制限を超えた
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    InternalError:
      description: サーバーの不具合。少し待って送り直す（送信は冪等なので同じ本文でよい）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MealFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        slot:
          type: string
          enum:
          - breakfast
          - lunch
          - dinner
          - snack
        time:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: 食べた時刻（HH:MM、日本時間）。分からなければ null
        description:
          type: string
          maxLength: 2000
          description: 写真や言葉から読み取った説明
        source:
          type: string
          enum:
          - photo
          - text
          - numbers
          - copy
          - template
        basis:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: kcal と PFC を推定したときの根拠（例「ごはんは茶碗1杯 150g として」）。MCP が推定したときだけ書く。アプリで記録した食事は null
      description: 食事。create では date, slot, description, source が要る。update では変えた項目だけを送る
    MealItemFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: 空白だけにはできない（前後の空白を除いてから確かめる）
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
          description: 量の数
        unit:
          type: string
          enum:
          - g
          - ml
          - 個
          - 杯
        kcal:
          type: number
          minimum: 0
          maximum: 20000
          description: この量でのエネルギー
        protein_g:
          type: number
          minimum: 0
          maximum: 5000
        fat_g:
          type: number
          minimum: 0
          maximum: 5000
        carbs_g:
          type: number
          minimum: 0
          maximum: 5000
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
      description: 食事の中の品目。parent_id に食事の ID を入れる。create では name, amount, unit, kcal, protein_g, fat_g, carbs_g, confidence, sort_order が要る。update では変えた項目だけを送る
    MealTemplateFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 空白だけにはできない（前後の空白を除いてから確かめる）
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - amount
            - unit
            - kcal
            - protein_g
            - fat_g
            - carbs_g
            - confidence
            properties:
              item_id:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 64
                pattern: ^[A-Za-z0-9_-]+$
                description: 品目の ID（省くとサーバーが並び順から決める）
              name:
                type: string
                minLength: 1
                maxLength: 200
                description: 空白だけにはできない（前後の空白を除いてから確かめる）
              amount:
                type: number
                exclusiveMinimum: 0
                maximum: 100000
                description: 量の数
              unit:
                type: string
                enum:
                - g
                - ml
                - 個
                - 杯
              kcal:
                type: number
                minimum: 0
                maximum: 20000
                description: この量でのエネルギー
              protein_g:
                type: number
                minimum: 0
                maximum: 5000
              fat_g:
                type: number
                minimum: 0
                maximum: 5000
              carbs_g:
                type: number
                minimum: 0
                maximum: 5000
              confidence:
                type: string
                enum:
                - high
                - medium
                - low
          description: 品目の一覧。項目としては1つ（一覧ごと置き換わる）
      description: いつもの。entity_id は uuid5(6f1d3c52-6a1e-4f5f-9d0b-2c7a8e0f4b61, 名前)。名前を含む変更で合わなければ invalid_fields。create では name, items が要る。update では変えた項目だけを送る
    NutritionGoalFields:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          enum:
          - bulk
          - maintain
          - cut
        body_weight_kg:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 300
        protein_per_kg:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 5
        targets:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - training_day
          - rest_day
          properties:
            training_day:
              type: object
              additionalProperties: false
              required:
              - kcal
              - fat_g
              - carbs_g
              properties:
                kcal:
                  type: number
                  minimum: 0
                  maximum: 20000
                fat_g:
                  type: number
                  minimum: 0
                  maximum: 5000
                carbs_g:
                  type: number
                  minimum: 0
                  maximum: 5000
            rest_day:
              type: object
              additionalProperties: false
              required:
              - kcal
              - fat_g
              - carbs_g
              properties:
                kcal:
                  type: number
                  minimum: 0
                  maximum: 20000
                fat_g:
                  type: number
                  minimum: 0
                  maximum: 5000
                carbs_g:
                  type: number
                  minimum: 0
                  maximum: 5000
          description: 筋トレの日と休みの日の目標。両方そろえて1つの項目にする（片方だけにならないように）
        eating_style:
          type:
          - string
          - 'null'
          enum:
          - home_cooked
          - eating_out
          - convenience_store
          - null
        target_weight_kg:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 300
      description: 食事の目標。entity_id は current だけ。create では policy が要る。update では変えた項目だけを送る
    DayTypeFields:
      type: object
      additionalProperties: false
      properties:
        day_type:
          type: string
          enum:
          - training
          - rest
      description: 日の種類。entity_id は日付（YYYY-MM-DD）。create では day_type が要る。update では変えた項目だけを送る
    BodyPartFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: アプリでは40文字まで（apps/mobile/lib/limits.ts）
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
        hidden:
          type: boolean
      description: 部位。create では name, sort_order, hidden が要る。update では変えた項目だけを送る
    ExerciseFields:
      type: object
      additionalProperties: false
      properties:
        body_part_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: アプリでは40文字まで（apps/mobile/lib/limits.ts）
        record_type:
          type: string
          enum:
          - weight_reps
          - reps_only
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
        hidden:
          type: boolean
        bodyweight_ratio:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: 回数だけ（reps_only）の種目の、体重に対する割合。自重の負荷量 ＝ その日の体重 × 割合 × 回数。null・なしは名前から決める（services/training/training/domain/bodyweight.py）
        big3:
          type:
          - string
          - 'null'
          enum:
          - bench
          - squat
          - deadlift
          - null
          description: BIG3 の役。1つの役は1つの種目だけ（アプリが前の種目から外して送る。重なったら ID の小さいほう）。どの種目にもなければ名前で決める（services/training/training/domain/big3.py）
        form_video_url:
          type:
          - string
          - 'null'
          maxLength: 2000
          pattern: ^https://\S+$
          description: フォームの動画のリンク（https:// で始まり、空白を含まない）。アプリの記録の入力の画面から開く
      description: 種目。create では body_part_id, name, record_type, sort_order, hidden が要る。update では変えた項目だけを送る
    WorkoutEntryFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        exercise_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
      description: トレーニングの中の種目（1日の1種目ぶん）。sort_order はその日に行った順。create では date, exercise_id, sort_order が要る。update では変えた項目だけを送る
    WorkoutSetFields:
      type: object
      additionalProperties: false
      properties:
        entry_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        set_index:
          type: integer
          minimum: 0
          maximum: 1000
        weight_kg:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 500
        reps:
          type: integer
          minimum: 0
          maximum: 10000
        memo:
          type: string
          maxLength: 1000
        done:
          type: boolean
      description: セット。重さはいつも kg。回数だけの種目は weight_kg が null。create では entry_id, set_index, reps が要る。update では変えた項目だけを送る
    BodyRecordFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        measured_at:
          type: string
          format: date-time
        weight_kg:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 300
        body_fat_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        lean_mass_kg:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 300
        memo:
          type: string
          maxLength: 1000
        source:
          type: string
          enum:
          - manual
          - health_connect
        external_id:
          type:
          - string
          - 'null'
          maxLength: 200
        origin_package:
          type:
          - string
          - 'null'
          maxLength: 200
      description: '体組成。取り込み（origin: import）より手入力が勝つ。create では date, measured_at, source が要る。update では変えた項目だけを送る。外した項目（muscle_pct・waist_cm）は、前の版のアプリが送っても断らずに捨てる'
    SettingFields:
      type: object
      additionalProperties: false
      properties:
        value:
          type:
          - string
          - 'null'
          maxLength: 1000
      description: 設定。entity_id は設定の名前（weight_unit など）。create では value が要る。update では変えた項目だけを送る
    SleepSessionFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
          description: 起きた日（その土地の日付）
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        asleep_min:
          type: integer
          minimum: 0
          maximum: 1440
          description: 眠っていた分（全体から、起きていた・ベッドの外の段階を引いたもの）
        awake_min:
          type: integer
          minimum: 0
          maximum: 1440
        source:
          type: string
          enum:
          - health_connect
        external_id:
          type:
          - string
          - 'null'
          maxLength: 200
        origin_package:
          type:
          - string
          - 'null'
          maxLength: 200
      description: '睡眠（Health Connect の SleepSession の1件。アプリの取り込みだけが作る。origin: import）。段階の詳細は持たない。create では date, start_at, end_at, asleep_min, awake_min, source が要る。update では変えた項目だけを送る'
    HeartRateDayFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
          description: 端末の暦の日付。entity_id は日付から決める（uuid5(取り込みの名前空間, "hc-hr-day:" + 日付)）
        resting_bpm:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 300
        avg_bpm:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 300
        min_bpm:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 300
        max_bpm:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 300
        samples:
          type: integer
          minimum: 0
          maximum: 1000000
          description: その日のサンプルの数。サンプルそのものは送らない
      description: '心拍の1日のまとめ（Health Connect の HeartRate・RestingHeartRate をその日について集計したもの。アプリの取り込みだけが作る。origin: import）。サンプルがない日は avg_bpm・min_bpm・max_bpm が null。create では date, samples が要る。update では変えた項目だけを送る'
    StepDayFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
          description: 端末の暦の日付。entity_id は日付から決める（uuid5(取り込みの名前空間, "hc-steps-day:" + 日付)）
        steps:
          type: integer
          minimum: 1
          maximum: 1000000
          description: その日の歩数の合計（Health Connect の集計。複数のアプリが同じ時間を書いた重なりは除かれている）。1件ごとの記録は送らない
      description: '歩数の1日の合計（Health Connect の Steps をその日について集計したもの。アプリの取り込みだけが作る。origin: import）。create では date, steps が要る。update では変えた項目だけを送る'
    InjuryFields:
      type: object
      additionalProperties: false
      properties:
        occurred_on:
          type: string
          format: date
          description: 痛めた日
        site:
          type: string
          enum:
          - shoulder_front
          - chest
          - biceps
          - forearm
          - trapezius
          - abs
          - obliques
          - quads
          - shins
          - shoulder_rear
          - triceps
          - lats
          - upper_back
          - lower_back
          - glutes
          - hamstrings
          - calves
          - neck
          - shoulder_joint
          - elbow
          - wrist
          - waist
          - hip
          - knee
          - ankle
          description: 部位のコード（services/training/training/domain/injury.py の SITES）。筋肉 shoulder_front（三角筋の前）〜calves、関節 neck〜ankle。左右は side で分ける（コードは左右で分けない）
        side:
          type:
          - string
          - 'null'
          enum:
          - left
          - right
          - null
          description: 左右。左右のない部位（abs・neck・waist）と、左右が分からないときは null。同じ変更に site もあるときは、左右のない部位に left・right を入れると断る
        exercise_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: そのときの種目（なければ null）
        phase:
          type: string
          maxLength: 100
          description: 場面（例：3セット目の下ろすとき）。空でもよい
        symptom:
          type: string
          maxLength: 500
          description: 症状（何が起きたか）。空でもよい
        cause:
          type: string
          maxLength: 500
          description: 原因の自己分析（本人の言葉のまま）。空でもよい
        fix:
          type: string
          maxLength: 500
          description: 次の直し方（本人の言葉のまま）。空でもよい
        status:
          type: string
          enum:
          - fixing
          - fixed
          description: fixing（直している途中）・fixed（直せた）
        fixed_on:
          type:
          - string
          - 'null'
          format: date
          description: 直せたにした日。直している途中なら null。同じ変更に status もあるときは、fixed なら日付、fixing なら null でないと断る。occurred_on もあるときは、同じか後の日
      description: ケガの記録（筋トレで痛めたときの場面・原因の自己分析・次の直し方）。痛みの強さ・体調・診断の項目はない。create では occurred_on, site, status が要る。update では変えた項目だけを送る。ケガを消すときは、その振り返り（injury_review）も消す
    InjuryReviewFields:
      type: object
      additionalProperties: false
      properties:
        injury_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 振り返るケガ（injury の ID）
        date:
          type: string
          format: date
          description: 試した日
        result:
          type: string
          enum:
          - fixed
          - not_yet
          - pain
          description: fixed（直せた）・not_yet（まだ）・pain（痛んだ）
        note:
          type: string
          maxLength: 500
          description: メモ。空でもよい
        exercise_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 試した種目（なければ null）
      description: ケガの振り返り（その後に直し方を試した結果）。create では injury_id, date, result が要る。update では変えた項目だけを送る。消えたケガの振り返りは、MCP では読まない
    PhaseDayTarget:
      type: object
      additionalProperties: false
      properties:
        kcal:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 20000
        protein_g:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 5000
    PhaseTargetChange:
      type: object
      additionalProperties: false
      required:
      - date
      - target_weight_kg
      - end_date
      properties:
        date:
          type: string
          format: date
          description: 変えた日（最初の1件は開始日）。この日から予定の線を引き直す
        target_weight_kg:
          type: number
          minimum: 30
          maximum: 300
        end_date:
          type: string
          format: date
          description: その時点の終了日（療養で止まった日を含まない）
        weight_kg:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 300
          description: 線の始まりの体重（変えたときの週の平均。最初の1件は開始時の体重）。null なら前の線のその日の値
    PhaseFields:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - normal
          - rehab
          description: normal（通常）・rehab（療養）
        direction:
          type:
          - string
          - 'null'
          enum:
          - bulk
          - cut
          - maintain
          - null
          description: bulk（増量）・cut（減量）・maintain（維持・リコンプ）。通常だけ（同じ変更に kind があるとき、normal で null・rehab で値は断る）
        name:
          type: string
          maxLength: 40
          description: 名前（任意）。空なら「増量 16週」のように出す
        start_date:
          type: string
          format: date
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: 予定の終わり（週数から。開始日＋7×週数−1）。療養で止まった日は含まない（実際の終わりは止まった日数だけ後ろにずれる。計算で出す）。療養は null
        target_weight_kg:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 300
          description: 目標体重。通常だけ（フェーズ実施中は、設定の目標体重よりこちらを使う）
        meal_targets:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - training_day
          - rest_day
          properties:
            training_day:
              $ref: '#/components/schemas/PhaseDayTarget'
            rest_day:
              $ref: '#/components/schemas/PhaseDayTarget'
          description: 食事の目標（筋トレの日・休みの日の kcal とたんぱく質）。1つの項目で置き換わる
        snapshot:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            weight_kg:
              type:
              - number
              - 'null'
              minimum: 30
              maximum: 300
              description: 開始時の体重
            body_fat_pct:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 100
            big3:
              type:
              - object
              - 'null'
              additionalProperties: false
              properties:
                bench:
                  type: [number, 'null']
                  exclusiveMinimum: 0
                  maximum: 1000
                squat:
                  type: [number, 'null']
                  exclusiveMinimum: 0
                  maximum: 1000
                deadlift:
                  type: [number, 'null']
                  exclusiveMinimum: 0
                  maximum: 1000
              description: BIG3 の推定1RM（kg）
            growth_score:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
          description: 開始時の記録（振り返りの before に使う）。ウエストは持たない
        status:
          type: string
          enum:
          - active
          - ended
          - aborted
          description: active（実施中）・ended（終了）・aborted（中断）。療養で止まっているかは状態に持たず、療養の行（paused_phase_id）から求める
        paused_phase_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 療養だけ：止めた通常のフェーズの ID。療養の [start_date, ended_on) が、そのフェーズの止まった日
        target_history:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PhaseTargetChange'
          description: 目標と終了日の変更の履歴（最初の1件は開始日）。一覧ごと置き換わる。null は断る（療養は空の一覧）
        ended_on:
          type:
          - string
          - 'null'
          format: date
          description: 終えた・中断した日（この日はフェーズに含まない）。同じ変更に status もあるときは、active なら null、ended・aborted なら日付でないと断る
      description: フェーズ（増量・減量・維持と療養の期間）。アプリだけが書く（MCP は list_phases・period_overview で読むだけ）。create では kind, start_date, status が要る。update では変えた項目だけを送る。同時に実施中は1つ（読む側が決める。2つあれば開始日の新しいもの）
    ReportTone:
      type: string
      enum:
      - good
      - steady
      - caution
      description: good（良い調子）・steady（いつもどおり）・caution（気をつけたい）
    ReportFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          maxLength: 20000
          description: くわしい本文（Markdown）。モデルが書いた文なので、アプリは文字として表示するだけ（HTML・リンクは開かない）
        kind:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - phase
          - other
          description: daily（日のまとめ。period_start と period_end が同じ日）・weekly（週のまとめ）・monthly（月のまとめ）・phase（フェーズの振り返り。phase_id と期間が要る）・other（その他。いまは保存できない）
        period_start:
          type:
          - string
          - 'null'
          format: date
        period_end:
          type:
          - string
          - 'null'
          format: date
          description: period_start と同じか後の日（366日以内。kind が phase なら1,096日以内）
        overall_tone:
          $ref: '#/components/schemas/ReportTone'
          description: 全体の調子。前の形のレポートにはない（アプリは steady として見せる）
        headline:
          type: string
          maxLength: 60
          description: ひと言の要約
        highlights:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
            - area
            - tone
            - text
            properties:
              area:
                type: string
                enum:
                - training
                - meals
                - body
                - sleep
              tone:
                $ref: '#/components/schemas/ReportTone'
              text:
                type: string
                minLength: 1
                maxLength: 120
              metric:
                type:
                - object
                - 'null'
                additionalProperties: false
                required:
                - label
                - value
                properties:
                  label:
                    type: string
                    minLength: 1
                    maxLength: 20
                  value:
                    type: number
                    minimum: -1000000
                    maximum: 1000000
                  unit:
                    type: string
                    maxLength: 10
                  delta:
                    type:
                    - number
                    - 'null'
                    minimum: -1000000
                    maximum: 1000000
                    description: 前の期間からの変化（value と同じ単位）
                  delta_good:
                    type:
                    - boolean
                    - 'null'
                    description: 変化の向きが利用者の目標にとって良いか
        next_steps:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: 次の一歩。日のまとめは1つ、週・月のまとめは3つまで（上限の検証は3件）
        next_steps_done:
          type: array
          maxItems: 3
          items:
            type: integer
            minimum: 0
            maximum: 2
          description: 済んだ次の一歩の番号（0 から。小さい順、重なりなし）。アプリのチェックで、アプリだけが update で書く（MCP は書かない）。読むときは next_steps にない番号を捨てる
        links:
          type: array
          maxItems: 3
          description: つながり（分野をまたぐ気づき）。前の形のレポートにはない
          items:
            type: object
            additionalProperties: false
            required:
            - from_area
            - to_area
            - text
            properties:
              from_area:
                type: string
                enum:
                - training
                - meals
                - body
                - sleep
              to_area:
                type: string
                enum:
                - training
                - meals
                - body
                - sleep
                description: from_area と違う分野
              text:
                type: string
                minLength: 1
                maxLength: 120
              basis:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 20
                description: 根拠の短い言葉（「2日」「3週」など）。なければ null
        review:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - text
          description: 目標の見直しの提案。前の形のレポートにはない
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 200
            target:
              type:
              - string
              - 'null'
              enum:
              - meals_goal
              - null
              description: 見直す目標。meals_goal ならアプリが食事の目標を開くボタンを出す。なければ null
        phase_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: どのフェーズの振り返りか（kind が phase のときだけ。PhaseFields の ID）。ほかの種類は持たない
      description: レポート（Claude・ChatGPT が MCP の save_report で書いたまとめ）。書くのは MCP だけで、アプリから受け付けるのは delete と、next_steps_done だけの update（create・restore、ほかの項目の update は op_not_allowed）。項目を JSON にした大きさは 150,000 バイトまで
