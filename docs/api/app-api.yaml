# トレログ アプリ用 API（同期）。設計は docs/sync-design.md。
# 生成したあとは、この YAML を直接直す。
openapi: 3.1.0
info:
  title: トレログ アプリ用 API
  version: 0.1.0
  description: |-
    スマホアプリ（トレログ）の同期の API。設計は docs/sync-design.md。

    - 認可：Cognito のアプリ用クライアント（torelog-app）のアクセストークンを `Authorization: Bearer` で送る。ID トークンは断る
    - 利用者はトークンの sub で決まる。本文や URL に利用者の ID は入れない
    - 時刻は UTC の RFC 3339（ミリ秒まで）。日付と食事の時刻（time）は日本時間
    - エラー：Lambda のエラーは application/problem+json（Problem）。API Gateway のエラー（401・403・429）は {"message": "..."}（GatewayError）
    - 流量の制限：1秒10回・瞬間20回。超えると 429（Retry-After はない。少し待って送り直す）
servers:
- url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com
  description: cdk deploy の出力 AppApiUrl
  variables:
    apiId:
      default: xxxxxxxxxx
security: []
paths:
  /v1/sync/changes:
    post:
      operationId: pushChanges
      summary: 端末の変更を送る（まとめて、冪等）
      description: |-
        1回に25件まで。1件ごとに accepted・duplicate・rejected を返す。rejected があっても、ほかの変更は受け付ける。
        応答を受け取れなかったときは、同じ change_id のまま送り直す。
      security:
      - cognito:
        - torelog-api/meals.write
      - cognito:
        - torelog-api/training.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: 1件ごとの結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          description: 本文の形が違う（JSON でない、changes が26件以上、change_id の重複など）。1件も受け付けていない
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: pullChanges
      summary: カーソル以降の変更を受け取る（ページ送り）
      description: seq が after より大きい変更を、seq の順に返す。読める scope のない種類は飛ばす。
      security:
      - cognito:
        - torelog-api/meals.read
      - cognito:
        - torelog-api/training.read
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: 変更と、当てはめたあとの状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '400':
          description: after・limit が範囲の外
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sync/snapshot:
    get:
      operationId: getSnapshot
      summary: 初回の全件の取得
      description: '今の状態を全部返す（消えたものも deleted: true で返す）。最初のページの cursor を覚え、全部読んだら /v1/sync/changes?after=cursor を読む。'
      security:
      - cognito:
        - torelog-api/meals.read
      - cognito:
        - torelog-api/training.read
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
        description: 前のページの next_page_token
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: 今の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          description: page_token が壊れている、ほかの人のもの、limit が範囲の外
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/meals/goal-suggestions:
    post:
      operationId: suggestGoals
      summary: 食事の目標の案を計算する（保存しない）
      description: MCP の suggest_goals と同じ計算。案を本人が確かめたら、nutrition_goal の update を同期で送って保存する。
      security:
      - cognito:
        - torelog-api/meals.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalSuggestionRequest'
      responses:
        '200':
          description: 目標の案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSuggestion'
        '400':
          description: 本文の形が違う（知らない項目、型、選択肢にない値）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 値が決まりに合わない（例：維持なのにペースが 0 でない、増量なのにペースがない、年齢が15〜100の外）。detail ではなく title に理由が入る
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cognito:
      type: oauth2
      description: Cognito のマネージドログイン（パスキー）。認可コード＋PKCE。毎回 prompt=login を付ける
      flows:
        authorizationCode:
          authorizationUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/token
          refreshUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/token
          scopes:
            openid: OIDC
            torelog-api/meals.read: 食事の記録を読む
            torelog-api/meals.write: 食事の記録を書く
            torelog-api/training.read: 筋トレの記録を読む
            torelog-api/training.write: 筋トレの記録を書く
  responses:
    Unauthorized:
      description: トークンがない、期限切れ、issuer か audience が違う（ID トークンや認可API のトークンを含む）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    Forbidden:
      description: ルートに要る scope がない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    TooManyRequests:
      description: 流量の制限を超えた
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    InternalError:
      description: サーバーの不具合。少し待って送り直す（送信は冪等なので同じ本文でよい）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MealFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        slot:
          type: string
          enum:
          - breakfast
          - lunch
          - dinner
          - snack
        time:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: 食べた時刻（HH:MM、日本時間）。分からなければ null
        description:
          type: string
          maxLength: 2000
          description: 写真や言葉から読み取った説明
        source:
          type: string
          enum:
          - photo
          - text
          - numbers
          - copy
          - template
      description: 食事。create では date, slot, description, source が要る。update では変えた項目だけを送る
    MealItemFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: 空白だけにはできない（前後の空白を除いてから確かめる）
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
          description: 量の数
        unit:
          type: string
          enum:
          - g
          - ml
          - 個
          - 杯
        kcal:
          type: number
          minimum: 0
          maximum: 20000
          description: この量でのエネルギー
        protein_g:
          type: number
          minimum: 0
          maximum: 5000
        fat_g:
          type: number
          minimum: 0
          maximum: 5000
        carbs_g:
          type: number
          minimum: 0
          maximum: 5000
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
      description: 食事の中の品目。parent_id に食事の ID を入れる。create では name, amount, unit, kcal, protein_g, fat_g, carbs_g, confidence, sort_order が要る。update では変えた項目だけを送る
    MealTemplateFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 空白だけにはできない（前後の空白を除いてから確かめる）
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - amount
            - unit
            - kcal
            - protein_g
            - fat_g
            - carbs_g
            - confidence
            properties:
              item_id:
                type:
                - string
                - 'null'
                minLength: 1
                maxLength: 64
                pattern: ^[A-Za-z0-9_-]+$
                description: 品目の ID（省くとサーバーが並び順から決める）
              name:
                type: string
                minLength: 1
                maxLength: 200
                description: 空白だけにはできない（前後の空白を除いてから確かめる）
              amount:
                type: number
                exclusiveMinimum: 0
                maximum: 100000
                description: 量の数
              unit:
                type: string
                enum:
                - g
                - ml
                - 個
                - 杯
              kcal:
                type: number
                minimum: 0
                maximum: 20000
                description: この量でのエネルギー
              protein_g:
                type: number
                minimum: 0
                maximum: 5000
              fat_g:
                type: number
                minimum: 0
                maximum: 5000
              carbs_g:
                type: number
                minimum: 0
                maximum: 5000
              confidence:
                type: string
                enum:
                - high
                - medium
                - low
          description: 品目の一覧。項目としては1つ（一覧ごと置き換わる）
      description: いつもの。entity_id は uuid5(6f1d3c52-6a1e-4f5f-9d0b-2c7a8e0f4b61, 名前)。名前を含む変更で合わなければ invalid_fields。create では name, items が要る。update では変えた項目だけを送る
    NutritionGoalFields:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          enum:
          - bulk
          - maintain
          - cut
        body_weight_kg:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 300
        protein_per_kg:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 5
        targets:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - training_day
          - rest_day
          properties:
            training_day:
              type: object
              additionalProperties: false
              required:
              - kcal
              - fat_g
              - carbs_g
              properties:
                kcal:
                  type: number
                  minimum: 0
                  maximum: 20000
                fat_g:
                  type: number
                  minimum: 0
                  maximum: 5000
                carbs_g:
                  type: number
                  minimum: 0
                  maximum: 5000
            rest_day:
              type: object
              additionalProperties: false
              required:
              - kcal
              - fat_g
              - carbs_g
              properties:
                kcal:
                  type: number
                  minimum: 0
                  maximum: 20000
                fat_g:
                  type: number
                  minimum: 0
                  maximum: 5000
                carbs_g:
                  type: number
                  minimum: 0
                  maximum: 5000
          description: 筋トレの日と休みの日の目標。両方そろえて1つの項目にする（片方だけにならないように）
        eating_style:
          type:
          - string
          - 'null'
          enum:
          - home_cooked
          - eating_out
          - convenience_store
          - null
        target_weight_kg:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 300
      description: 食事の目標。entity_id は current だけ。create では policy が要る。update では変えた項目だけを送る
    DayTypeFields:
      type: object
      additionalProperties: false
      properties:
        day_type:
          type: string
          enum:
          - training
          - rest
      description: 日の種類。entity_id は日付（YYYY-MM-DD）。create では day_type が要る。update では変えた項目だけを送る
    BodyPartFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: アプリでは40文字まで（apps/mobile/lib/limits.ts）
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
        hidden:
          type: boolean
      description: 部位。create では name, sort_order, hidden が要る。update では変えた項目だけを送る
    ExerciseFields:
      type: object
      additionalProperties: false
      properties:
        body_part_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: アプリでは40文字まで（apps/mobile/lib/limits.ts）
        record_type:
          type: string
          enum:
          - weight_reps
          - reps_only
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
        hidden:
          type: boolean
      description: 種目。create では body_part_id, name, record_type, sort_order, hidden が要る。update では変えた項目だけを送る
    WorkoutEntryFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        exercise_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000
      description: トレーニングの中の種目（1日の1種目ぶん）。sort_order はその日に行った順。create では date, exercise_id, sort_order が要る。update では変えた項目だけを送る
    WorkoutSetFields:
      type: object
      additionalProperties: false
      properties:
        entry_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        set_index:
          type: integer
          minimum: 0
          maximum: 1000
        weight_kg:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 500
        reps:
          type: integer
          minimum: 0
          maximum: 10000
        memo:
          type: string
          maxLength: 1000
        done:
          type: boolean
      description: セット。重さはいつも kg。回数だけの種目は weight_kg が null。create では entry_id, set_index, reps が要る。update では変えた項目だけを送る
    BodyRecordFields:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-11-08'
        measured_at:
          type: string
          format: date-time
        weight_kg:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 300
        body_fat_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        muscle_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        lean_mass_kg:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 300
        waist_cm:
          type:
          - number
          - 'null'
          minimum: 30
          maximum: 200
        memo:
          type: string
          maxLength: 1000
        source:
          type: string
          enum:
          - manual
          - health_connect
        external_id:
          type:
          - string
          - 'null'
          maxLength: 200
        origin_package:
          type:
          - string
          - 'null'
          maxLength: 200
      description: '体組成。取り込み（origin: import）より手入力が勝つ。create では date, measured_at, source が要る。update では変えた項目だけを送る'
    SettingFields:
      type: object
      additionalProperties: false
      properties:
        value:
          type:
          - string
          - 'null'
          maxLength: 1000
      description: 設定。entity_id は設定の名前（weight_unit など）。create では value が要る。update では変えた項目だけを送る
    EntityType:
      type: string
      enum:
      - meal
      - meal_item
      - meal_template
      - nutrition_goal
      - day_type
      - body_part
      - exercise
      - workout_entry
      - workout_set
      - body_record
      - setting
      description: 対象の種類。meal・meal_item・meal_template・nutrition_goal・day_type は meals.*、それ以外は training.* の scope で扱う
    MealChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: meal
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID
        parent_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: meal_item だけ：親の食事の ID（必須）。品目は parent_id と entity_id の組で指す（別の parent_id なら別の品目）。ほかの種類は null か省く
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/MealFields'
          description: create・update のとき。delete・restore では送らない
    MealItemChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      - parent_id
      properties:
        entity_type:
          type: string
          const: meal_item
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID
        parent_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: meal_item だけ：親の食事の ID（必須）。品目は parent_id と entity_id の組で指す（別の parent_id なら別の品目）。ほかの種類は null か省く
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/MealItemFields'
          description: create・update のとき。delete・restore では送らない
    MealTemplateChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: meal_template
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID
        parent_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: meal_item だけ：親の食事の ID（必須）。品目は parent_id と entity_id の組で指す（別の parent_id なら別の品目）。ほかの種類は null か省く
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
