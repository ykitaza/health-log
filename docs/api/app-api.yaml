          setting: '#/components/schemas/SettingChange'
    PushRequest:
      type: object
      additionalProperties: false
      required:
      - device_id
      - changes
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 端末の ID（アプリを入れたときに作る UUID）
        changes:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/Change'
          description: 変えた順に並べる。25件より多いときは分けて送る
    PushResult:
      type: object
      required:
      - change_id
      - status
      properties:
        change_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - accepted
          - duplicate
          - rejected
          description: accepted：受け付けた。duplicate：前に受け付けた（状態は変わらない）。rejected：断った（送り直しても同じなので、端末で扱いを決める）
        seq:
          type:
          - integer
          - 'null'
          description: 受け付けた変更の通し番号（rejected では null）
        error:
          oneOf:
          - $ref: '#/components/schemas/ChangeError'
          - type: 'null'
    ChangeError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - invalid_fields
          - missing_fields
          - missing_parent_id
          - parent_id_not_allowed
          - fields_not_allowed
          - insufficient_scope
          description: invalid_fields：知らない項目・型（"10" と 10、1 と true は別）・範囲の違い、null にできない項目に null、entity_id・op・changed_at・origin の誤り。missing_fields：create に要る項目がない。missing_parent_id：meal_item に parent_id がない。parent_id_not_allowed：meal_item
            以外に parent_id がある。fields_not_allowed：delete・restore に fields がある。insufficient_scope：その種類を書く scope がない
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    PushResponse:
      type: object
      required:
      - results
      - cursor
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'
          description: 送った順
        cursor:
          type: integer
          description: サーバーの今の通し番号（受け取りの目安）
    EntityState:
      type: object
      required:
      - entity_type
      - entity_id
      - parent_id
      - fields
      - deleted
      - created_at
      - updated_at
      - deleted_at
      - seq
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        fields:
          type: object
          description: 今の値（種類ごとの *Fields の形。まだ届いていない項目はない）
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 当てはめた変更の時刻のうち、いちばん新しいもの
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        seq:
          type: integer
          description: この状態に最後に当てはめた変更の通し番号。端末は大きい方を残す
    ChangeRecord:
      type: object
      required:
