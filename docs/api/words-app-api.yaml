        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/ExpressionTagFields'
          description: create・update の項目。delete・restore には入れない
    EncounterChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: encounter
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID（UUID）
        parent_id:
          type: 'null'
          description: ことばの種類は親と一緒に保存しない（子は expression_id で指す）。null か省く
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
          description: アプリから送れる op：create・update・delete・restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/EncounterFields'
          description: create・update の項目。delete・restore には入れない
    UsageChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: usage
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID（UUID）
        parent_id:
          type: 'null'
          description: ことばの種類は親と一緒に保存しない（子は expression_id で指す）。null か省く
        op:
          type: string
          enum:
          - create
          - delete
          description: アプリから送れる op：create・delete
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/UsageFields'
          description: create・update の項目。delete・restore には入れない
    ListenSessionChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: listen_session
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID（UUID）
        parent_id:
          type: 'null'
          description: ことばの種類は親と一緒に保存しない（子は expression_id で指す）。null か省く
        op:
          type: string
          enum:
          - create
          - delete
          description: アプリから送れる op：create・delete
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/ListenSessionFields'
          description: create・update の項目。delete・restore には入れない
    Change:
      oneOf:
      - $ref: '#/components/schemas/SourceChange'
      - $ref: '#/components/schemas/ExpressionChange'
      - $ref: '#/components/schemas/TagChange'
      - $ref: '#/components/schemas/ExpressionTagChange'
      - $ref: '#/components/schemas/EncounterChange'
      - $ref: '#/components/schemas/UsageChange'
      - $ref: '#/components/schemas/ListenSessionChange'
      discriminator:
        propertyName: entity_type
        mapping:
          source: '#/components/schemas/SourceChange'
          expression: '#/components/schemas/ExpressionChange'
          tag: '#/components/schemas/TagChange'
          expression_tag: '#/components/schemas/ExpressionTagChange'
          encounter: '#/components/schemas/EncounterChange'
          usage: '#/components/schemas/UsageChange'
          listen_session: '#/components/schemas/ListenSessionChange'
    PushRequest:
      type: object
      additionalProperties: false
      required:
      - device_id
      - changes
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 端末の ID（アプリを入れたときに作る UUID）
        changes:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/Change'
          description: 変えた順に並べる。25件より多いときは分けて送る
    PushResult:
      type: object
      required:
      - change_id
      - status
      properties:
        change_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - accepted
          - duplicate
          - rejected
          description: accepted：受け付けた。duplicate：前に受け付けた（状態は変わらない）。rejected：断った（送り直しても同じなので、端末で扱いを決める）
        seq:
          type:
          - integer
          - 'null'
          description: 受け付けた変更の通し番号（rejected では null）
        error:
          oneOf:
          - $ref: '#/components/schemas/ChangeError'
          - type: 'null'
    ChangeError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - invalid_fields
          - missing_fields
          - missing_parent_id
          - parent_id_not_allowed
          - fields_not_allowed
          - insufficient_scope
          - op_not_allowed
          description: invalid_fields：知らない項目・型（"10" と 10、1 と true は別）・範囲の違い、null にできない項目に null、entity_id・op・changed_at・origin
            の誤り。missing_fields：create に要る項目がない。missing_parent_id：meal_item に parent_id がない。parent_id_not_allowed：meal_item
            以外に parent_id がある。fields_not_allowed：delete・restore に fields がある。insufficient_scope：その種類を書く scope がない。op_not_allowed：アプリから受け付けない
            op か項目（report の delete と next_steps_done の update 以外）
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    PushResponse:
      type: object
      required:
      - results
      - cursor
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'
          description: 送った順
        cursor:
          type: integer
          description: サーバーの今の通し番号（受け取りの目安）
    EntityState:
      type: object
      required:
      - entity_type
      - entity_id
      - parent_id
      - fields
      - deleted
      - created_at
      - updated_at
      - deleted_at
      - seq
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        fields:
          type: object
          description: 今の値（種類ごとの *Fields の形。まだ届いていない項目はない）
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 当てはめた変更の時刻のうち、いちばん新しいもの
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        seq:
          type: integer
          description: この状態に最後に当てはめた変更の通し番号。端末は大きい方を残す
    ChangeRecord:
      type: object
      required:
      - seq
      - change_id
      - entity_type
      - entity_id
      - parent_id
      - op
      - fields
      - changed_at
      - received_at
      - origin
      - device_id
      properties:
        seq:
          type: integer
        change_id:
          type: string
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        fields:
          type:
          - object
          - 'null'
        changed_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        origin:
          type: string
          enum:
          - app
          - import
          - mcp
          - migration
        device_id:
          type:
          - string
          - 'null'
    ChangesPage:
      type: object
      required:
      - entries
      - next_cursor
      - has_more
      properties:
        entries:
          type: array
          items:
            type: object
            required:
            - change
            - state
            properties:
              change:
                $ref: '#/components/schemas/ChangeRecord'
              state:
                $ref: '#/components/schemas/EntityState'
        next_cursor:
          type: integer
          description: 次の after に使う（読めない種類の変更を飛ばした分も進む）
        has_more:
          type: boolean
    SnapshotPage:
      type: object
      required:
      - states
      - cursor
      - next_page_token
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/EntityState'
        cursor:
          type: integer
          description: 最初のページを読んだときの通し番号。全部読んだら、ここから /v1/sync/changes を読む
        next_page_token:
          type:
          - string
          - 'null'
          description: null なら終わり
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: 例：changes[2].fields.amount
        message:
          type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      description: Lambda が返すエラー（RFC 9457）
      properties:
        type:
          type: string
          description: 例：https://torelog.invalid/problems/invalid-request
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    GatewayError:
      type: object
      required:
      - message
      description: API Gateway が Lambda の前で返すエラー（形は変えられない）。401：Unauthorized、403：Forbidden、429：Too Many Requests
      properties:
        message:
          type: string
