# ことば アプリ用 API（同期）。設計は docs/words-design.md。
# services/words/scripts/gen_openapi.py で作る（直接は直さない）。
openapi: 3.1.0
info:
  title: ことば アプリ用 API
  version: 0.1.0
  description: 'スマホアプリ（ことば、apps/words）の同期の API。設計は docs/words-design.md の「同期」。


    - 形は KARADA のアプリ用 API（docs/api/app-api.yaml）の同期と同じ。テーブルと変更の番号は KARADA と別（WordsTable）

    - 認可：KARADA と同じ Cognito のアプリ用クライアント（torelog-app）のアクセストークン。scope は torelog-api/training.*

    - 利用者はトークンの sub で決まる。本文や URL に利用者の ID は入れない

    - 時刻は UTC の RFC 3339（ミリ秒まで）。日付は日本時間（午前4時で区切る）

    - 流量の制限：1秒2回・瞬間10回。超えると 429

    - 初期の行（出会った場所5つ・タグ20個）は固定の ID（testdata/words/catalog.json）。変えるまで送らず、変えた項目だけを update で送る'
servers:
- url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com
  description: cdk deploy の出力 WordsAppApiUrl（SSM /cognito-study/words/app/api-url）
  variables:
    apiId:
      default: xxxxxxxxxx
security: []
paths:
  /v1/sync/changes:
    post:
      operationId: pushChanges
      summary: 端末の変更を送る（まとめて、冪等）
      description: '1回に25件まで、本文は 64KB（65536 バイト）まで。1件ごとに accepted・duplicate・rejected を返す。rejected があっても、ほかの変更は受け付ける。

        応答を受け取れなかったときは、同じ change_id のまま送り直す。'
      security:
      - cognito:
        - torelog-api/training.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: 1件ごとの結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          description: 本文の形が違う（JSON でない、changes が26件以上、change_id の重複など）。1件も受け付けていない
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 本文が 64KB を超える。1件も受け付けていない。changes を分けて送る
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: pullChanges
      summary: カーソル以降の変更を受け取る（ページ送り）
      description: seq が after より大きい変更を、seq の順に返す。読める scope のない種類は飛ばす。
      security:
      - cognito:
        - torelog-api/training.read
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: 変更と、当てはめたあとの状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '400':
          description: after・limit が範囲の外
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sync/snapshot:
    get:
      operationId: getSnapshot
      summary: 初回の全件の取得
      description: '今の状態を全部返す（消えたものも deleted: true で返す）。最初のページの cursor を覚え、全部読んだら /v1/sync/changes?after=cursor を読む。'
      security:
      - cognito:
        - torelog-api/training.read
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
        description: 前のページの next_page_token
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: 今の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          description: page_token が壊れている、ほかの人のもの、limit が範囲の外
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/audio:
    post:
      operationId: synthesizeAudio
      summary: 「聞く」の読み上げ（MP3。設定の「自然な声」のときだけ）
      description: '表現の項目から決まった型の台本（表現 → 読み → 説明（意味とニュアンス）→ 使い方 → 例文1〜2個。区切りは SSML の間）を作り、Amazon Polly（ja-JP、neural）で読んだ MP3
        を返す。音声はサーバーにもアプリにも置かない（毎回作る。cache-control: no-store）。既定のアプリは端末の読み上げ（Android の TTS）で同じ型の台本を読み、この API は呼ばない。'
      security:
      - cognito:
        - torelog-api/training.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expression_id
              properties:
                expression_id:
                  type: string
                  format: uuid
                voice:
                  type: string
                  enum:
                  - Kazuha
                  - Takumi
                  - Tomoko
                  default: Kazuha
      responses:
        '200':
          description: MP3（24kHz）
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: 本文の形が違う
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 表現がない（消した・まだ同期していない）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cognito:
      type: oauth2
      description: Cognito のマネージドログイン（パスキー）。認可コード＋PKCE。毎回 prompt=login を付ける
      flows:
        authorizationCode:
          authorizationUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/token
          refreshUrl: https://oidc-study-{account}.auth.ap-northeast-1.amazoncognito.com/oauth2/token
          scopes:
            openid: OIDC
            torelog-api/training.read: ことばの記録を読む（KARADA の筋トレと同じ scope）
            torelog-api/training.write: ことばの記録を書く（同上）
  responses:
    Unauthorized:
      description: トークンがない、期限切れ、issuer か audience が違う（ID トークンや認可API のトークンを含む）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    Forbidden:
      description: ルートに要る scope がない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    TooManyRequests:
      description: 流量の制限を超えた
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    InternalError:
      description: サーバーの不具合。少し待って送り直す（送信は冪等なので同じ本文でよい）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    EntityType:
      type: string
      enum:
      - source
      - expression
      - tag
      - expression_tag
      - encounter
      - usage
      - listen_session
      description: 対象の種類。どれも torelog-api/training.* の scope で扱う
    SourceFields:
      additionalProperties: false
      properties:
        name:
          maxLength: 40
          minLength: 1
          type: string
        icon_key:
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9_-]+$
          type: string
        sort_order:
          maximum: 100000
          minimum: 0
          type: integer
        hidden:
          type: boolean
      type: object
      description: 出会った場所。アプリからは create・update・restore だけ（消すのは hidden）。create で要る項目：name・icon_key・sort_order・hidden
    ExampleFields:
      additionalProperties: false
      description: 例文1つ。本人のもの（origin user）と Claude のもの（補う）。confirmed は本人が確かめたか（本人のものはいつも true）。
      properties:
        text:
          maxLength: 200
          minLength: 1
          type: string
        origin:
          enum:
          - user
          - claude
          type: string
        confirmed:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - text
      - origin
      - confirmed
      - created_at
      - updated_at
      type: object
    ExpressionFields:
      additionalProperties: false
      properties:
        text:
          maxLength: 200
          minLength: 1
          type: string
        source_id:
          anyOf:
          - pattern: ^[A-Za-z0-9_-]{1,64}$
            type: string
          - type: 'null'
        normalized_key:
          maxLength: 600
          minLength: 0
          type: string
        scene:
          maxLength: 300
          minLength: 0
          type: string
        note:
          maxLength: 1000
          minLength: 0
          type: string
        star:
          type: boolean
        place:
          enum:
          - collected
          - hand
          - own
          type: string
        stage:
          anyOf:
          - enum:
            - understood
            - used
            type: string
          - type: 'null'
        moved_at:
          type: string
        hand_since:
          anyOf:
          - type: string
          - type: 'null'
        interval_days:
          maximum: 60
          minimum: 1
          type: integer
        due_on:
          anyOf:
          - type: string
          - type: 'null'
        listened_at:
          anyOf:
          - type: string
          - type: 'null'
        listen_count:
          maximum: 1000000
          minimum: 0
          type: integer
        use_count:
          maximum: 1000000
          minimum: 0
          type: integer
        last_used_on:
          anyOf:
          - type: string
          - type: 'null'
        reading:
          maxLength: 100
          minLength: 0
          type: string
        use_note:
          maxLength: 300
          minLength: 0
          type: string
        meaning:
          maxLength: 300
          minLength: 0
          type: string
        nuance:
          maxLength: 500
          minLength: 0
          type: string
        register:
          anyOf:
          - enum:
            - spoken
            - written
            - formal
            type: string
          - type: 'null'
        register_by:
          anyOf:
          - enum:
            - user
            - claude
            type: string
          - type: 'null'
        examples:
          items:
            $ref: '#/components/schemas/ExampleFields'
          maxItems: 8
          type: array
        similar:
          items:
            maxLength: 100
            minLength: 1
            type: string
          maxItems: 5
          type: array
        usefulness:
          anyOf:
          - maximum: 3
            minimum: 1
            type: integer
          - type: 'null'
        usefulness_reason:
          maxLength: 200
          minLength: 0
          type: string
        usefulness_until:
          anyOf:
          - type: string
          - type: 'null'
        enriched_at:
          anyOf:
          - type: string
          - type: 'null'
      type: object
      description: 表現。補う項目（meaning・nuance・similar・usefulness・usefulness_reason・usefulness_until・enriched_at）はアプリから書けない。間隔の項目（stage・interval_days・due_on・listened_at・listen_count・use_count・last_used_on）は組で送る。例文（examples）は本人と
        Claude の両方が書く一覧（一覧ごと置き換わる）。create で要る項目：text・normalized_key・place
    TagFields:
      additionalProperties: false
      properties:
        kind:
          enum:
          - situation
          - feeling
          type: string
        name:
          maxLength: 20
          minLength: 1
          type: string
        sort_order:
          maximum: 100000
          minimum: 0
          type: integer
        hidden:
          type: boolean
        created_by:
          enum:
          - user
          - claude
          - seed
          type: string
      type: object
      description: 使う場面・気持ちのタグ。アプリからは create・update・restore だけ（消すのは hidden）。create で要る項目：kind・name・sort_order・hidden
    ExpressionTagFields:
      additionalProperties: false
      properties:
        expression_id:
          pattern: ^[A-Za-z0-9_-]{1,64}$
          type: string
        tag_id:
          pattern: ^[A-Za-z0-9_-]{1,64}$
          type: string
        added_by:
          enum:
          - user
          - claude
          type: string
        status:
          enum:
          - confirmed
          - proposed
          - rejected
          type: string
        confirmed_at:
          anyOf:
          - type: string
          - type: 'null'
      type: object
      description: 表現とタグのつながり。entity_id は uuid5(ことばの名前空間, "<expression_id>:<tag_id>")（testdata/words/catalog.json）。added_by・status・confirmed_at
        は組で送る。表現と一緒に消す。create で要る項目：expression_id・tag_id・added_by・status
    EncounterFields:
      additionalProperties: false
      properties:
        expression_id:
          pattern: ^[A-Za-z0-9_-]{1,64}$
          type: string
        source_id:
          anyOf:
          - pattern: ^[A-Za-z0-9_-]{1,64}$
            type: string
          - type: 'null'
        title:
          maxLength: 200
          minLength: 0
          type: string
        locator:
          maxLength: 100
          minLength: 0
          type: string
        met_on:
          anyOf:
          - type: string
          - type: 'null'
        time_hint:
          maxLength: 50
          minLength: 0
          type: string
        scene:
          maxLength: 300
          minLength: 0
          type: string
        surrounding_text:
          maxLength: 1000
          minLength: 0
          type: string
        wording:
          maxLength: 200
          minLength: 0
          type: string
        captured_via:
          enum:
          - mcp
          - app
          type: string
        note:
          maxLength: 500
          minLength: 0
          type: string
      type: object
      description: 出会い1回。表現と一緒に消す。create で要る項目：expression_id
    UsageFields:
      additionalProperties: false
      properties:
        expression_id:
          pattern: ^[A-Za-z0-9_-]{1,64}$
          type: string
        used_on:
          type: string
        scene:
          maxLength: 300
          minLength: 0
          type: string
        note:
          maxLength: 300
          minLength: 0
          type: string
      type: object
      description: 実際の会話で使えた1回。追記だけ（create・delete）。表現と一緒に消す。create で要る項目：expression_id・used_on
    ListenSessionFields:
      additionalProperties: false
      properties:
        started_at:
          type: string
        listened_on:
          type: string
        seconds:
          maximum: 86400
          minimum: 0
          type: integer
        items:
          maximum: 1000
          minimum: 0
          type: integer
      type: object
      description: アプリで聞いた1回（続けて流したまとまり）。追記だけ（create・delete）。活動の記録に使う。create で要る項目：started_at・listened_on・seconds・items
    SourceChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: source
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID（UUID）
        parent_id:
          type: 'null'
          description: ことばの種類は親と一緒に保存しない（子は expression_id で指す）。null か省く
        op:
          type: string
          enum:
          - create
          - update
          - restore
          description: アプリから送れる op：create・update・restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/SourceFields'
          description: create・update の項目。delete・restore には入れない
    ExpressionChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: expression
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID（UUID）
        parent_id:
          type: 'null'
          description: ことばの種類は親と一緒に保存しない（子は expression_id で指す）。null か省く
        op:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
          description: アプリから送れる op：create・update・delete・restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/ExpressionFields'
          description: create・update の項目。delete・restore には入れない
    TagChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: tag
        change_id:
          type: string
          format: uuid
          description: 変更の ID。送り直すときも同じ値にする（冪等）
        entity_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 対象の ID（UUID）
        parent_id:
          type: 'null'
          description: ことばの種類は親と一緒に保存しない（子は expression_id で指す）。null か省く
        op:
          type: string
          enum:
          - create
          - update
          - restore
          description: アプリから送れる op：create・update・restore
        changed_at:
          type: string
          format: date-time
          description: 端末で変えた時刻（UTC、ミリ秒まで）
          example: '2026-11-08T03:15:22.123Z'
        origin:
          type: string
          enum:
          - app
          - import
          default: app
          description: app は手入力、import は Health Connect の取り込み
        fields:
          $ref: '#/components/schemas/TagFields'
          description: create・update の項目。delete・restore には入れない
    ExpressionTagChange:
      type: object
      additionalProperties: false
      required:
      - change_id
      - entity_type
      - entity_id
      - op
      - changed_at
      properties:
        entity_type:
          type: string
          const: expression_tag
        change_id:
