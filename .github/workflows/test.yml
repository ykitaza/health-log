name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 初期の権限はなし。ジョブごとに必要なものだけを与える
permissions: {}

# 同じブランチ（PR）の古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR で変わったパスを調べて、関係するジョブだけを動かす。main への push と手で起動したときは全部を動かす。
  # ワークフローの on.paths で絞ると、必須のチェックが出ずに PR をマージできなくなるので使わない。
  # 飛ばしたジョブ（skipped）は、必須のチェックを満たした扱いになる
  changes:
    runs-on: ubuntu-latest
    permissions:
      # PR の変わったファイルを API で読む（checkout はしない）
      pull-requests: read
    outputs:
      all: ${{ github.event_name != 'pull_request' }}
      # 変わったものに当たったフィルターの名前の JSON の配列（例 ["meals","sync"]）
      filters: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # python の各サービスは、自分のフォルダと、依存するもの（pyproject.toml の path の依存と pythonpath）で動かす。
          # testdata/ はサーバーの計算（training・meals）と突き合わせているので、それらとそれに依存するものも動かす。
          # どのフィルターにも、このワークフロー自身を入れる
          filters: |
            workflow: &workflow
              - .github/workflows/test.yml
            authorization:
              - *workflow
              - services/authorization/**
            sync:
              - *workflow
              - services/sync/**
            meals:
              - *workflow
              - services/meals/**
              - services/sync/**
              - testdata/**
            training:
              - *workflow
              - services/training/**
              - services/sync/**
              - testdata/**
            reports:
              - *workflow
              - services/reports/**
              - services/sync/**
            app_api:
              - *workflow
              - services/app_api/**
              - services/meals/**
              - services/training/**
              - services/reports/**
              - services/sync/**
              - services/composition/**
              - testdata/**
            mcp:
              - *workflow
              - services/mcp/**
              - services/meals/**
              - services/training/**
              - services/reports/**
              - services/sync/**
              - services/composition/**
              - testdata/**
            # Lambda に入るコード（cdk/build-lambda.sh が services/ からコピーする）も含める
            cdk:
              - *workflow
              - cdk/**
              - services/**
            mobile:
              - *workflow
              - apps/mobile/**
              - testdata/**

  python:
    name: python (${{ matrix.service }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [authorization, meals, sync, training, reports, app_api, mcp]
    env:
      RUN: ${{ needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.filters), matrix.service) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      # ジョブの if では matrix を使えないので、ステップごとに飛ばす（ジョブは成功になり、必須のチェックを満たす）
      - name: Skip if unchanged
        if: env.RUN != 'true'
        # checkout をしないので、services/ のフォルダはない
        working-directory: ${{ github.workspace }}
        run: echo "services/${{ matrix.service }} とその依存は変わっていないので、テストを飛ばす"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      # Python の版は、各フォルダの .python-version を uv が読む
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.RUN == 'true'
        with:
          working-directory: services/${{ matrix.service }}
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked
        if: env.RUN == 'true'
      - run: uv run pytest
        if: env.RUN == 'true'

  cdk:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.filters), 'cdk')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mobile:
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.filters), 'mobile')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node の版は apps/mobile/.node-version を読む
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # eslint-config-expo（apps/mobile/eslint.config.js）。警告も通さない
      - run: npx expo lint . --max-warnings 0
      - run: npx jest

  # 画面の E2E。Expo の web 向けの書き出しを、Pixel と同じ大きさの Chromium で操作する（apps/mobile/e2e/README.md）。
  # テストの本体が長いので、2つのジョブに分けて同時に流す（--shard）。必須のチェックではないので、名前が変わっても PR は止まらない
  mobile-e2e:
    name: mobile (e2e ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.filters), 'mobile')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
      # Playwright のブラウザ（~/.cache/ms-playwright）は、Playwright の版ごとにキャッシュする。
      # 当たったときは、ブラウザは入れずに OS の依存（apt）だけを入れる
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      # 失敗したときだけ、レポートとトレースを残す
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/mobile/playwright-report/
            apps/mobile/test-results/
          retention-days: 7
