name: test

on:
  pull_request:
  push:
    branches: [main]

# 初期の権限はなし。ジョブごとに必要なものだけを与える
permissions: {}

# 同じブランチ（PR）の古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [authorization, meals]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python の版は、各フォルダの .python-version を uv が読む
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: services/${{ matrix.service }}
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked
      - run: uv run pytest

  cdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
