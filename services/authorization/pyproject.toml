[project]
name = "cognito-study"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
