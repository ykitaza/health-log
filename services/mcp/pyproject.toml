[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP サーバーの組み立て（食事と筋トレのツールを1つのコネクタにまとめる）"
requires-python = ">=3.12"
# sync・meals・training・reports はパッケージなので path の依存で入れる（meals・training・reports は MCP のツールを使うので extra の mcp も）。
# Lambda には、cdk/build-lambda.sh がソースをコピーする。
# 組み立ての場所どうしで共有するもの（services/composition）はパッケージにせず、pythonpath に足す
dependencies = [
    "anyio>=4.9",
    "mcp>=2.3.0",
    "meals[mcp]",
    "pyjwt[crypto]>=2.15.1",
    "reports[mcp]",
    "sync",
    "training[mcp]",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
meals = { path = "../meals", editable = true }
reports = { path = "../reports", editable = true }
sync = { path = "../sync", editable = true }
training = { path = "../training", editable = true }

[tool.pytest.ini_options]
pythonpath = [".", "../composition"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3>=1.43.111",
    "moto>=5.2.4",
    "pytest>=9.1.1",
]
