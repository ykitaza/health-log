[project]
name = "app-api"
version = "0.1.0"
description = "スマホアプリ用の API の Lambda の組み立て（同期の入口に、食事と筋トレの種類とルートを登録する）"
requires-python = ">=3.12"
# sync と training はパッケージなので path の依存で入れる。
# 食事（services/meals）はトップレベルに domain・application などを置くアプリなので、パッケージにはせず、
# テストでは pythonpath に ../meals を足し、Lambda には cdk/build-lambda.sh がソースをコピーする。
# anyio と pydantic は、ここで使う食事のコード（infrastructure/sync_*、presentation/app_routes）が使うもの
dependencies = [
    "anyio>=4.9",
    "pydantic>=2.11",
    "sync",
    "training",
]

[tool.uv.sources]
sync = { path = "../sync", editable = true }
training = { path = "../training", editable = true }

[tool.pytest.ini_options]
pythonpath = [".", "../meals"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3>=1.43.111",
    "moto>=5.2.4",
    "pytest>=9.1.1",
]
