[project]
name = "words"
version = "0.1.0"
description = "ことば（日本語の表現を集めて、話すときに使えるようにする）のコンテキストと、MCP の Lambda・アプリ用の同期の Lambda の組み立て"
requires-python = ">=3.12"
# sync と mcp-connector はパッケージなので path の依存で入れる。
# Lambda には、cdk/build-lambda.sh がソースをコピーする（MCP の WordsMcpFunction と、アプリ用の WordsAppApiFunction は同じもの）
dependencies = [
    "anyio>=4.9",
    "mcp>=2.3.0",
    "mcp-connector",
    "pydantic>=2.11",
    "pyjwt[crypto]>=2.15.1",
    "sync",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
mcp-connector = { path = "../mcp_connector", editable = true }
sync = { path = "../sync", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3>=1.44.3",
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
]
