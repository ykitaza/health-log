[project]
name = "meals"
version = "0.1.0"
description = "食事記録コンテキスト（MCP のツール。サーバーの組み立ては services/mcp）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "sync",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3>=1.43.111",
    "moto>=5.2.4",
    "pytest>=9.1.1",
]

# 同期の共通の部品（services/sync）。同じリポジトリの中なので path の依存にし、編集がすぐ効くように editable にする
[tool.uv.sources]
sync = { path = "../sync", editable = true }
